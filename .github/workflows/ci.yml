name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run unit tests
        run: PYTHONPATH=src python -m pytest tests/ -q

      - name: Validate metainfo
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('io.github.roddolf.CloudPcConnect.metainfo.xml'); print('metainfo XML OK')"
