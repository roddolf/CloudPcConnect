name: Release

# Push a tag vX.Y.Z (matching pkgver in packaging/arch/PKGBUILD) to build the
# Arch package and attach it to a GitHub release. A manual run builds the
# package from the selected commit and keeps it as a run artifact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  arch:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Prepare the build user
        run: |
          pacman -Syu --noconfirm --needed git
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builder

      - uses: actions/checkout@v5

      - name: Check the tag matches pkgver
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          pkgver=$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)
          test "v$pkgver" = "$GITHUB_REF_NAME" || {
            echo "::error::Tag $GITHUB_REF_NAME doesn't match pkgver $pkgver"; exit 1; }

      - name: Build the package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          build=/home/builder/build
          install -d -o builder "$build"
          # Build the checked-out commit rather than fetching the tag from GitHub.
          sed "s|git+https://github.com/roddolf/CloudPcConnect.git#tag=v\${pkgver}|git+file://$GITHUB_WORKSPACE#commit=$GITHUB_SHA|" \
            packaging/arch/PKGBUILD > "$build/PKGBUILD"
          chown -R builder "$build"
          cd "$build"
          sudo -u builder git config --global --add safe.directory '*'
          sudo -u builder makepkg --syncdeps --noconfirm --noprogressbar
          cp "$build"/*.pkg.tar.zst "$GITHUB_WORKSPACE/"

      - name: Upload artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: cloud-pc-connect
          path: '*.pkg.tar.zst'

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: '*.pkg.tar.zst'
          generate_release_notes: true
